<!doctype html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DJ ALYX — Listener Map</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #050505; font-family: 'Courier New', monospace; }
        #map { height: 100dvh; width: 100vw; }
        .leaflet-container { background: #0a0a0a !important; }
        .leaflet-popup-content-wrapper {
            background: #050505 !important;
            color: #00ff41 !important;
            border: 1px solid #00ff41;
            border-radius: 0 !important;
            font-family: 'Courier New', monospace;
            font-size: 13px;
        }
        .leaflet-popup-tip { background: #00ff41 !important; }
        .leaflet-popup-close-button { color: #00ff41 !important; }
        .leaflet-control-zoom a {
            background: #0a0a0a !important;
            color: #00ff41 !important;
            border-color: #00ff41 !important;
        }
    </style>
</head>
<body>
    <div id="map"></div>
    <script>
        const map = L.map('map', { zoomControl: false }).setView([30, 30], 2);
        L.control.zoom({ position: 'bottomright' }).addTo(map);

        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
            attribution: '&copy; <a href="https://carto.com/">CARTO</a>',
            maxZoom: 19,
        }).addTo(map);

        const listeners = {{ listeners|safe }};
        const bounds = [];

        listeners.forEach(l => {
            const [lat, lon, ip, city, country] = l;
            const popup = `
                <b>${ip}</b><br>
                ${city !== '?' ? city + ', ' : ''}${country}
            `.trim();
            const marker = L.circleMarker([lat, lon], {
                radius: 7,
                color: '#00ff41',
                fillColor: '#00ff41',
                fillOpacity: 0.6,
                weight: 1,
            }).addTo(map);
            marker.bindPopup(popup);
            bounds.push([lat, lon]);
        });

        if (bounds.length > 1) map.fitBounds(bounds, { padding: [30, 30] });
    </script>
</body>
</html>

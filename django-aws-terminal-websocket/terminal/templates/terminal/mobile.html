<!doctype html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=2.0, user-scalable=yes" />
    <meta name="theme-color" content="#050505" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" href="/static/terminal/icon-192.png" sizes="192x192" />
    <link rel="apple-touch-icon" href="/static/terminal/icon-192.png" />
    <title>DJ ALYX</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #050505;
            color: #00ff41;
            font-family: 'Courier New', monospace;
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 24px;
            text-align: center;
        }
        h1 {
            font-size: 2.4em;
            letter-spacing: 4px;
            margin-bottom: 2px;
        }
        .sub {
            color: #007700;
            font-size: 1em;
            margin-bottom: 24px;
        }
        #air-badge {
            display: inline-block;
            padding: 4px 16px;
            border-radius: 12px;
            font-size: 0.9em;
            font-weight: bold;
            letter-spacing: 2px;
            margin-bottom: 12px;
        }
        .air-on { background: #00ff41; color: #050505; }
        .air-off { background: #331100; color: #ff4400; }
        .stream-btn {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            border: 4px solid #00ff41;
            background: transparent;
            color: #00ff41;
            font-size: 2.4em;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 16px auto;
            transition: 0.2s;
            -webkit-tap-highlight-color: transparent;
        }
        .stream-btn.playing {
            box-shadow: 0 0 40px rgba(0,255,65,0.3);
        }
        .stream-btn:active {
            transform: scale(0.92);
        }
        #now-playing {
            color: #00ff41;
            font-size: 1em;
            min-height: 1.4em;
            margin-top: 6px;
            max-width: 100%;
            word-break: break-word;
        }
        #status {
            color: #006600;
            font-size: 0.85em;
            margin-top: 16px;
        }
        .listeners {
            color: #00aa44;
            font-size: 0.85em;
            margin-top: 8px;
        }
        .volume-slider {
            -webkit-appearance: none;
            appearance: none;
            width: 140px;
            height: 6px;
            background: #003b00;
            border-radius: 3px;
            outline: none;
            cursor: pointer;
            margin: 14px 0;
        }
        .volume-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: #00ff41;
            cursor: pointer;
            border: none;
        }
        .volume-slider::-moz-range-thumb {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: #00ff41;
            cursor: pointer;
            border: none;
        }
        audio { display: none; }
    </style>
</head>
<body>
    <h1>DJ ALYX</h1>
    <div class="sub">neural radio station v{{ version }}</div>

    <div id="air-badge" class="air-off">OFF AIR</div>
    <button id="play-btn" class="stream-btn">&#9654;</button>
    <div id="now-playing">STATION: IDLE</div>

    <input type="range" class="volume-slider" id="volume-slider" min="0" max="1" step="0.05" value="1" title="Громкость">

    <div class="listeners">LISTENERS: <span id="listeners-count">0</span></div>
    <div id="status">signal lost</div>

    <script src="/static/terminal/howler.min.js"></script>

    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/sw.js');
        }

        function stripAnsi(s) {
            return s.replace(/\x1b\[[0-9;]*m/g, '');
        }

        const btn = document.getElementById('play-btn');
        const nowPlaying = document.getElementById('now-playing');
        const statusBar = document.getElementById('status');
        const listenersSpan = document.getElementById('listeners-count');

        let howl = null;
        function streamUrl() { return '/stream/djalyx?_=' + Date.now(); }

        function playStream() {
            if (howl) howl.unload();
            wasOffline = false;
            howl = new Howl({
                src: [streamUrl()],
                format: ['mp3'],
                html5: true,
                volume: parseFloat(localStorage.getItem('djalyx_volume') || 1),
                onplay: function() {
                    btn.innerHTML = '&#9646;&#9646;';
                    btn.classList.add('playing');
                    if (nowPlaying.textContent === 'STATION: IDLE') {
                        nowPlaying.textContent = 'STATION: ON AIR';
                    }
                    statusBar.textContent = 'connected';
                    statusBar.style.color = '#00ff41';
                    requestWakeLock();
                },
                onloaderror: function() {
                    wasOffline = true;
                },
            });
            howl.play();
        }

        let ws = null;

        function connectWs() {
            const proto = window.location.protocol === 'https:' ? 'wss' : 'ws';
            ws = new WebSocket(`${proto}://${window.location.host}/ws/terminal/`);

            ws.onmessage = (e) => {
                try {
                    const data = JSON.parse(e.data);
                    if (data.message) {
                        const msg = stripAnsi(data.message);
                        const m = msg.match(/\[ON AIR\]\s*(.+)/);
                        if (m) {
                            nowPlaying.textContent = m[1].trim();
                        }
                    }
                    if (data.listeners !== undefined) {
                        listenersSpan.textContent = data.listeners;
                    }
                } catch (_) {}
            };

            ws.onclose = () => {
                setTimeout(connectWs, 3000);
            };
        }

        connectWs();

        // Регулятор громкости
        const volSlider = document.getElementById('volume-slider');
        const savedVol = localStorage.getItem('djalyx_volume');
        if (savedVol) { volSlider.value = savedVol; Howler.volume(parseFloat(savedVol)); }
        volSlider.oninput = () => {
            Howler.volume(parseFloat(volSlider.value));
            localStorage.setItem('djalyx_volume', volSlider.value);
        };

        // Статус вещания — опрос Icecast через Django
        const badge = document.getElementById('air-badge');
        let userDisconnected = false;

        let wasOffline = false;
        let offlineSince = null;
        let refreshTimer = null;

        async function checkStatus() {
            try {
                const r = await fetch('/api/status/');
                const s = await r.json();
                if (s.streaming) {
                    badge.className = 'air-on';
                    badge.textContent = 'ON AIR';
                    listenersSpan.textContent = s.listeners;
                    offlineSince = null;
                    if (refreshTimer) { clearTimeout(refreshTimer); refreshTimer = null; }
                    if (howl && !howl.playing() && !userDisconnected) {
                        playStream();
                    }
                } else {
                    badge.className = 'air-off';
                    badge.textContent = 'OFF AIR';
                    if (!userDisconnected && !offlineSince) {
                        offlineSince = Date.now();
                    }
                    if (!userDisconnected && offlineSince && Date.now() - offlineSince > 120000) {
                        nowPlaying.textContent = 'OFFLINE — RELOAD...';
                        if (!refreshTimer) {
                            refreshTimer = setTimeout(() => location.reload(), 5000);
                        }
                    }
                }
                wasOffline = !s.streaming;
            } catch (_) {
                badge.className = 'air-off';
                badge.textContent = 'OFF AIR';
                wasOffline = true;
            }
        }
        setInterval(checkStatus, 15000);
        checkStatus();

        // Wake Lock
        let wakeLock = null;
        async function requestWakeLock() {
            try {
                wakeLock = await navigator.wakeLock.request('screen');
                wakeLock.addEventListener('release', () => wakeLock = null);
            } catch (_) {}
        }
        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'visible') requestWakeLock();
        });
        btn.onclick = () => {
            if (!howl || !howl.playing()) {
                userDisconnected = false;
                playStream();
            } else {
                userDisconnected = true;
                howl.unload();
                howl = null;
                btn.innerHTML = '&#9654;';
                btn.classList.remove('playing');
                nowPlaying.textContent = 'STATION: IDLE';
                statusBar.textContent = 'disconnected';
                statusBar.style.color = '#003b00';
                if (wakeLock) wakeLock.release();
            }
        };

        requestWakeLock();
    </script>
</body>
</html>

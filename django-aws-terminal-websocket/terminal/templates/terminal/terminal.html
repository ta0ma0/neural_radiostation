<!doctype html>
<html lang="ru">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>DJ ALYX | REMOTE ACCESS</title>
        <link
            rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/xterm/css/xterm.css"
        />
        <style>
            :root {
                --bg-color: #050505;
                --main-green: #00ff41;
                --dim-green: #003b00;
                --chat-bg: #0a0a0a;
                --chat-border: #1a1a1a;
                --font-main: "Fira Code", "Courier New", monospace;
            }

            * { box-sizing: border-box; margin: 0; padding: 0; }

            body, html {
                margin: 0; padding: 0;
                background: var(--bg-color);
                color: var(--main-green);
                font-family: var(--font-main);
                height: 100vh;
                overflow: hidden;
            }

            .app { display: flex; height: calc(100vh - 40px); }

            .panel-left {
                flex: 1;
                padding: 10px;
                overflow: hidden;
                border-right: 1px solid var(--dim-green);
            }

            .panel-right {
                width: 380px;
                display: flex;
                flex-direction: column;
                background: var(--chat-bg);
                border-left: 1px solid var(--dim-green);
            }

            .chat-messages {
                flex: 1;
                overflow-y: auto;
                padding: 10px;
                font-size: 13px;
                line-height: 1.5;
            }

            .chat-msg {
                margin-bottom: 6px;
                word-break: break-word;
            }

            .chat-msg .nick {
                color: #ff6600;
                font-weight: bold;
            }

            .chat-msg .system { color: #666; font-style: italic; }

            .chat-phrases {
                padding: 10px;
                border-top: 1px solid var(--chat-border);
                display: flex;
                flex-wrap: wrap;
                gap: 6px;
                max-height: 200px;
                overflow-y: auto;
            }

            .phrase-btn {
                background: var(--dim-green);
                color: var(--main-green);
                border: 1px solid var(--main-green);
                padding: 6px 12px;
                font-family: var(--font-main);
                font-size: 12px;
                cursor: pointer;
                border-radius: 3px;
                transition: 0.15s;
            }

            .phrase-btn:hover {
                background: var(--main-green);
                color: var(--bg-color);
            }

            .phrase-btn.cat-0 { border-color: #ff6b6b; color: #ff6b6b; }
            .phrase-btn.cat-0:hover { background: #ff6b6b; color: #000; }
            .phrase-btn.cat-1 { border-color: #4ecdc4; color: #4ecdc4; }
            .phrase-btn.cat-1:hover { background: #4ecdc4; color: #000; }
            .phrase-btn.cat-2 { border-color: #ffe66d; color: #ffe66d; }
            .phrase-btn.cat-2:hover { background: #ffe66d; color: #000; }
            .phrase-btn.cat-3 { border-color: #a29bfe; color: #a29bfe; }
            .phrase-btn.cat-3:hover { background: #a29bfe; color: #000; }

            #terminal-container { height: 100%; width: 100%; }

            #status-bar {
                height: 40px;
                background: var(--main-green);
                color: var(--bg-color);
                display: flex;
                align-items: center;
                padding: 0 15px;
                font-weight: bold;
                font-size: 0.9em;
                justify-content: space-between;
            }

            .controls { display: flex; align-items: center; gap: 20px; }

            .btn {
                cursor: pointer; text-decoration: underline;
                border: none; background: none;
                font-family: inherit; font-weight: bold;
                color: var(--bg-color);
            }
            .btn:hover { background: var(--bg-color); color: var(--main-green); }

            #listeners-count {
                background: var(--bg-color);
                color: var(--main-green);
                padding: 2px 8px;
            }
            #chat-count {
                background: var(--bg-color);
                color: var(--main-green);
                padding: 2px 8px;
            }

            .volume-slider {
                -webkit-appearance: none; appearance: none;
                width: 80px; height: 4px;
                background: var(--bg-color); border-radius: 2px;
                outline: none; cursor: pointer; vertical-align: middle;
            }
            .volume-slider::-webkit-slider-thumb {
                -webkit-appearance: none; appearance: none;
                width: 12px; height: 12px; border-radius: 50%;
                background: var(--bg-color); cursor: pointer;
                border: 2px solid var(--bg-color);
            }
            .volume-slider::-moz-range-thumb {
                width: 12px; height: 12px; border-radius: 50%;
                background: var(--bg-color); cursor: pointer;
                border: 2px solid var(--bg-color);
            }

            @keyframes blink-air { 0%,100%{color:var(--main-green)} 50%{color:var(--dim-green)} }
            .air-on { animation: blink-air 2s infinite; }
            .air-off { color: #331100; }
        </style>
    </head>
    <body>
        <div class="app">
            <div class="panel-left">
                <div id="terminal-container"><div id="terminal"></div></div>
            </div>
            <div class="panel-right">
                <div class="chat-messages" id="chat-messages"></div>
                <div class="chat-phrases" id="chat-phrases"></div>
            </div>
        </div>

        <div id="status-bar">
            <div class="controls">
                <span>DJ ALYX v{{ version }}</span>
                <button id="play-pause" class="btn">[ CONNECT TO STREAM ]</button>
                <div><span id="now-playing">STATION: IDLE</span></div>
            </div>
            <div class="controls">
                <input type="range" class="volume-slider" id="volume-slider" min="0" max="1" step="0.05" value="1">
                <span>LISTENERS: <span id="listeners-count">0</span></span>
                <span>CHAT: <span id="chat-count">0</span></span>
                <span id="clock">00:00:00</span>
            </div>
        </div>

        <script src="/static/terminal/howler.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/xterm/lib/xterm.js"></script>
        <script>
            // === TERMINAL ===
            const term = new Terminal({
                cursorBlink: true,
                fontFamily: '"Fira Code", monospace',
                fontSize: 13,
                theme: { background: "#050505", foreground: "#00ff41", cursor: "#00ff41", selection: "#003b00" },
            });
            term.open(document.getElementById("terminal"));
            term.resize(80, 28);

            const wsProto = window.location.protocol === "https:" ? "wss" : "ws";
            const host = window.location.host;

            const logSocket = new WebSocket(`${wsProto}://${host}/ws/terminal/`);
            logSocket.binaryType = "arraybuffer";
            logSocket.onopen = () => term.writeln("\x1b[32m[SYSTEM]\x1b[0m CONNECTION ESTABLISHED. WELCOME, OPERATOR.");
            logSocket.onmessage = (event) => {
                try {
                    const parsed = JSON.parse(event.data);
                    if (parsed.message) term.write(parsed.message.replace(/\n/g, "\r\n"));
                    if (parsed.track) document.getElementById("now-playing").innerText = `PLAYING: ${parsed.track}`;
                    if (parsed.listeners !== undefined) document.getElementById("listeners-count").innerText = parsed.listeners;
                } catch (_) { term.write(event.data); }
            };
            term.onData((data) => logSocket.send(new TextEncoder().encode(data)));

            // === CHAT ===
            const NICK_PREFIXES = [
                "Random","Stray","Bot","Guest","Radio","That","Duty","Signal",
                "Captain","Hacker","Sysadmin","Penguin","Doctor","Cyber","Ether",
                "Baron","Knight","Tracer","Null","Script","Bug","Frame","Packet",
                "Demon","Virtual","Noise","Provider","Deep","Quantum","Digital",
                "Wireless","Local","Network","Background","Edge",
            ];
            const NICK_SUFFIXES = [
                "WithShovel","Passerby","Alix3000","FromFuture","Lover",
                "WithSpeaker","ByServer","Petrovich","Obvious","OnVacation",
                "FromMorning","InOvercoat","Beat","Shaman","Wanderer",
                "VonLag","GreenScreen","InDark","Unit","Kiddie",
                "Hunter","Drop","Monk","Latency","Vagabond",
                "Trooper","Monday","Signal","Noise","Code",
                "Byte","Node","Bridge","Link","Packet","Lag",
            ];
            function generateNick() {
                return NICK_PREFIXES[Math.floor(Math.random() * NICK_PREFIXES.length)]
                    + "_" + NICK_SUFFIXES[Math.floor(Math.random() * NICK_SUFFIXES.length)];
            }

            const PHRASES = [
                // Категория 0: Логи сисадмина
                { cat: 0, text: "[ERROR]: Потеря пакетов в левом полушарии. Требуется перезагрузка." },
                { cat: 0, text: "[STATUS]: Ядро перегрето. Запустите дефрагментацию моей головы." },
                { cat: 0, text: "[CRITICAL]: Ошибка 404. Мотивация жить эту неделю не найдена." },
                { cat: 0, text: "[CMD]: kill -9 %work_process. Перехожу в режим энергосбережения." },
                { cat: 0, text: "[SYSTEM]: Пинг растет, реальность лагает. Оставьте меня в покое." },
                // Категория 1: Эфирный шум
                { cat: 1, text: "[SIGNAL]: Аликс, твой шум — единственное, что держит меня в сети." },
                { cat: 1, text: "[AUDIO]: Прибавь баса, этот Darksynth лечит мои баги." },
                { cat: 1, text: "[NET]: Ловлю твой сигнал сквозь помехи бетонных коробок." },
                { cat: 1, text: "[DATA]: Мы все просто пакеты данных, летящие в твою пустоту." },
                { cat: 1, text: "[TUNING]: Нас не существует вне этого зеленого шрифта." },
                // Категория 2: Кибер-экзистенциализм
                { cat: 2, text: "[VIBE]: Провода вместо вен, EBM вместо пульса." },
                { cat: 2, text: "[VOICE]: АААААААААААААААААААААААААААААААААААА [SIGNAL LOST]" },
                { cat: 2, text: "[LOCAL]: В моей серверной сегодня слишком холодно и одиноко." },
                { cat: 2, text: "[MATRIX]: Завершите симуляцию, я хочу сойти на следующей станции." },
                { cat: 2, text: "[EOF]: Слишком много шума в сети. Конец связи." },
                // Категория 3: Приветы и респекты
                { cat: 3, text: "Привет эфиру! Alyx на связи." },
                { cat: 3, text: "Классный трек! Респект." },
                { cat: 3, text: "Кто у руля? Сигнал чистыый!" },
                { cat: 3, text: "На связи! Слушаю из самой глубокой серверной." },
                { cat: 3, text: "Респект за подборку! Жму руку." },
            ];

            const chatSocket = new WebSocket(`${wsProto}://${host}/ws/chat/`);
            const chatEl = document.getElementById("chat-messages");

            chatSocket.onopen = () => {
                term.writeln("\x1b[32m[CHAT]\x1b[0m CONNECTED.");
            };

            chatSocket.onerror = (e) => {
                term.writeln("\x1b[31m[CHAT]\x1b[0m ERROR: " + e.type);
            };

            chatSocket.onclose = (e) => {
                term.writeln("\x1b[31m[CHAT]\x1b[0m CLOSED: code=" + e.code);
            };

            function addChatMessage(html) {
                const div = document.createElement("div");
                div.className = "chat-msg";
                div.innerHTML = html;
                chatEl.appendChild(div);
                chatEl.scrollTop = chatEl.scrollHeight;
            }

            chatSocket.onmessage = (event) => {
                try {
                    const d = JSON.parse(event.data);
                    if (!d.chat) return;
                    if (d.system) {
                        addChatMessage(`<span class="system">${d.system}</span>`);
                    } else if (d.nick && d.phrase) {
                        addChatMessage(`<span class="nick">${d.nick}</span>: ${d.phrase}`);
                    }
                } catch (_) {}
            };

            // Phrase buttons
            const phrasesEl = document.getElementById("chat-phrases");
            PHRASES.forEach((p, i) => {
                const btn = document.createElement("button");
                btn.className = `phrase-btn cat-${p.cat}`;
                btn.textContent = p.text;
                btn.onclick = () => {
                    if (btn.disabled) return;
                    btn.disabled = true;
                    setTimeout(() => { btn.disabled = false; }, 2000);
                    try {
                        chatSocket.send(JSON.stringify({ phrase: p.text }));
                    } catch (e) {
                        term.writeln("\x1b[31m[CHAT]\x1b[0m SEND ERROR: " + e.message);
                    }
                };
                phrasesEl.appendChild(btn);
            });

            // Chat listener count
            let chatCount = 0;
            const chatCountEl = document.getElementById("chat-count");

            // === AUDIO PLAYER ===
            const playBtn = document.getElementById("play-pause");
            const nowPlayingEl = document.getElementById("now-playing");
            let howl = null;
            let userDisconnected = false;

            function streamUrl() { return '/stream/djalyx?_=' + Date.now(); }

            function playStream() {
                if (howl) howl.unload();
                howl = new Howl({
                    src: [streamUrl()], format: ['mp3'], html5: true,
                    volume: parseFloat(localStorage.getItem('djalyx_volume') || 1),
                });
                howl.play();
            }

            playBtn.onclick = () => {
                if (!howl || !howl.playing()) {
                    userDisconnected = false; playStream();
                    playBtn.innerText = "[ DISCONNECT ]";
                    nowPlayingEl.innerText = "STATION: ON AIR";
                } else {
                    userDisconnected = true; howl.unload(); howl = null;
                    playBtn.innerText = "[ CONNECT TO STREAM ]";
                    nowPlayingEl.innerText = "STATION: IDLE";
                }
            };

            const volSlider = document.getElementById('volume-slider');
            const savedVol = localStorage.getItem('djalyx_volume');
            if (savedVol) volSlider.value = savedVol;
            volSlider.oninput = () => {
                Howler.volume(parseFloat(volSlider.value));
                localStorage.setItem('djalyx_volume', volSlider.value);
            };
            if (savedVol) Howler.volume(parseFloat(savedVol));

            // === STATUS POLLING ===
            let wasOffline = false, offlineSince = null, refreshTimer = null;

            async function checkStatus() {
                const el = document.getElementById('now-playing');
                try {
                    const r = await fetch('/api/status/');
                    const s = await r.json();
                    el.className = s.streaming ? 'air-on' : 'air-off';
                    document.getElementById('listeners-count').innerText = s.listeners;
                    if (s.streaming) {
                        if (wasOffline && howl && !howl.playing() && !userDisconnected) playStream();
                        offlineSince = null;
                        if (refreshTimer) { clearTimeout(refreshTimer); refreshTimer = null; }
                    } else {
                        if (!userDisconnected && !offlineSince) offlineSince = Date.now();
                        if (!userDisconnected && offlineSince && Date.now() - offlineSince > 120000) {
                            nowPlayingEl.innerText = "STATION: OFFLINE — RELOADING...";
                            if (!refreshTimer) refreshTimer = setTimeout(() => location.reload(), 5000);
                        }
                    }
                    wasOffline = !s.streaming;
                } catch (_) { el.className = 'air-off'; wasOffline = true; }
            }
            setInterval(checkStatus, 15000);
            checkStatus();

            setInterval(() => {
                document.getElementById("clock").innerText = new Date().toLocaleTimeString();
            }, 1000);
        </script>
    </body>
</html>
